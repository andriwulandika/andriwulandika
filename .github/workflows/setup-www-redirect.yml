name: Setup redirect www -> apex (Cloudflare Redirect Rule)

on:
  workflow_dispatch:
  # push-trigger pada file ini sendiri diperlukan agar GitHub meregistrasi
  # workflow (file belum ada di branch default, dispatch-only akan 404)
  push:
    paths:
      - ".github/workflows/setup-www-redirect.yml"

jobs:
  apply-rule:
    name: Pasang Redirect Rule www.andriwulandika.uk -> andriwulandika.uk
    runs-on: ubuntu-latest
    env:
      CF_API: https://api.cloudflare.com/client/v4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Lookup zone andriwulandika.uk
        id: zone
        run: |
          RESP=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF_API/zones?name=andriwulandika.uk")
          echo "$RESP" | jq '{success, errors, zones: [.result[]? | {id, name, status}]}'
          ZONE_ID=$(echo "$RESP" | jq -r '.result[0].id // empty')
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"

      - name: Cek ruleset dynamic-redirect yang sudah ada
        id: existing
        if: steps.zone.outputs.zone_id != ''
        run: |
          RESP=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF_API/zones/${{ steps.zone.outputs.zone_id }}/rulesets/phases/http_request_dynamic_redirect/entrypoint")
          echo "$RESP" | jq '{success, errors, existing_rules: [.result.rules[]? | {id, description}]}'
          echo "$RESP" | jq -c '[.result.rules[]? | select(.description != "www -> apex andriwulandika.uk")]' > existing_rules.json
          cat existing_rules.json

      - name: Pasang Redirect Rule (dynamic redirect phase, gabung dengan rule lama)
        if: steps.zone.outputs.zone_id != ''
        run: |
          NEW_RULE='{
            "description": "www -> apex andriwulandika.uk",
            "expression": "(http.host eq \"www.andriwulandika.uk\")",
            "action": "redirect",
            "action_parameters": {
              "from_value": {
                "status_code": 301,
                "target_url": {
                  "expression": "concat(\"https://andriwulandika.uk\", http.request.uri.path)"
                },
                "preserve_query_string": true
              }
            }
          }'
          RULES=$(jq -c --argjson new "$NEW_RULE" '. + [$new]' existing_rules.json)
          curl -s -X PUT \
            "$CF_API/zones/${{ steps.zone.outputs.zone_id }}/rulesets/phases/http_request_dynamic_redirect/entrypoint" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"rules\": $RULES}" \
            | jq '{success, errors, messages, result: (.result | {id, phase, rules: [.rules[]? | {id, description, action}]})}'
