name: Deploy web (andriwulandika-web Worker)

on:
  push:
    branches:
      - main
      - feat/web-next-foundation
      - claude/cloudflare-worker-deploy-18589i
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy ke Cloudflare Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext for Cloudflare)
        run: npm run cf:build

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply andriwulandika-web-db --remote

      - name: Sinkron secret ADMIN_PASSWORD ke Worker (jika sudah diset)
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -n "$ADMIN_PASSWORD" ]; then
            echo "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          else
            echo "ADMIN_PASSWORD belum diset di GitHub Secrets — skip, /admin/leads tidak akan bisa diakses sampai diset."
          fi

      - name: Deploy Worker
        run: npx opennextjs-cloudflare deploy
