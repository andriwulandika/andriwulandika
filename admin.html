<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Kelola Kode Akses | Andri Wulandika</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --bg2: #f5f5f7; --text: #1d1d1f; --text2: #6e6e73;
      --accent: #0071e3; --border: #d2d2d7; --radius: 14px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg2); color: var(--text); -webkit-font-smoothing: antialiased;
      min-height: 100vh; padding: 24px;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
    .sub { font-size: 0.85rem; color: var(--text2); margin-bottom: 24px; }

    /* Login gate */
    .gate {
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 32px; max-width: 380px; margin: 60px auto; text-align: center;
    }
    .gate h2 { font-size: 1.2rem; margin-bottom: 16px; }
    .gate input {
      width: 100%; background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; font-size: 0.9rem; margin-bottom: 12px;
      outline: none; font-family: inherit;
    }
    .gate input:focus { border-color: var(--accent); }
    .gate button, .btn {
      background: var(--accent); color: #fff; border: none; border-radius: 980px;
      padding: 11px 22px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: background 0.2s;
    }
    .gate button:hover, .btn:hover { background: #0077ed; }
    .gate-error { color: #cc0000; font-size: 0.8rem; margin-bottom: 10px; display: none; }

    /* Dashboard */
    #panel { display: none; }
    .card {
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; margin-bottom: 20px;
    }
    .card h2 { font-size: 1.05rem; margin-bottom: 16px; }
    .form-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .form-row input {
      flex: 1; min-width: 140px; background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 14px; font-size: 0.85rem; font-family: inherit; outline: none;
    }
    .form-row input:focus { border-color: var(--accent); }
    .result-box {
      display: none; background: #e8f8ee; border: 1px solid #a3d9b4; color: #1a7a3e;
      border-radius: 10px; padding: 14px; font-size: 0.85rem; margin-bottom: 14px;
    }
    .result-box code {
      font-family: 'SF Mono', monospace; font-size: 0.95rem; font-weight: 700;
      background: #fff; padding: 3px 10px; border-radius: 6px; display: inline-block; margin: 4px 0;
    }
    .copy-btn {
      background: #fff; border: 1px solid #a3d9b4; color: #1a7a3e; border-radius: 980px;
      padding: 4px 12px; font-size: 0.72rem; cursor: pointer; margin-left: 8px; font-family: inherit;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--text2); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
    td code { font-family: 'SF Mono', monospace; font-size: 0.8rem; }
    .badge { font-size: 0.7rem; padding: 2px 9px; border-radius: 980px; font-weight: 600; }
    .badge.active { background: #e8f8ee; color: #1a7a3e; }
    .badge.expired { background: #ffeef0; color: #cc0000; }
    .revoke-btn {
      background: #ffeef0; color: #cc0000; border: 1px solid #ffc6cc; border-radius: 980px;
      padding: 4px 12px; font-size: 0.72rem; cursor: pointer; font-family: inherit;
    }
    .revoke-btn:hover { background: #ffd9de; }
    .empty { text-align: center; color: var(--text2); padding: 24px 0; font-size: 0.85rem; }
    .refresh-link {
      font-size: 0.78rem; color: var(--accent); text-decoration: none; cursor: pointer; float: right;
    }
    .back { display: inline-block; margin-bottom: 14px; font-size: 0.82rem; color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- LOGIN GATE -->
    <div class="gate" id="gate">
      <h2>🔒 Admin Login</h2>
      <div class="gate-error" id="gateError"></div>
      <input type="password" id="adminPw" placeholder="Password admin" autocomplete="off"/>
      <button onclick="adminLogin()">Masuk</button>
    </div>

    <!-- PANEL -->
    <div id="panel">
      <a href="index.html" class="back">← Beranda</a>
      <h1>Kelola Kode Akses</h1>
      <p class="sub">Generate dan kelola kode akses berlangganan untuk SiRENJA, SiRKPD, SiPerda, dan SiGenDok.</p>

      <div class="card">
        <h2>+ Generate Kode Baru</h2>
        <div class="form-row">
          <input type="text" id="customerName" placeholder="Nama pelanggan (opsional)"/>
          <input type="number" id="customerDays" placeholder="Masa berlaku (hari)" value="30" min="1"/>
          <button class="btn" onclick="generateCode()">Generate</button>
        </div>
        <div class="result-box" id="resultBox"></div>
      </div>

      <div class="card">
        <h2>Daftar Kode Aktif <a class="refresh-link" onclick="loadCodes()">↻ Muat ulang</a></h2>
        <div id="codesTable"></div>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://andriwulandika.wulandikaandri.workers.dev';

    function getAdminPw() { return sessionStorage.getItem('admin_pw') || ''; }

    (function init() {
      if (getAdminPw()) {
        document.getElementById('gate').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        loadCodes();
      }
    })();

    document.getElementById('adminPw').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') adminLogin();
    });

    async function adminLogin() {
      const pw = document.getElementById('adminPw').value;
      const errBox = document.getElementById('gateError');
      if (!pw) return;

      // verifikasi password dengan memanggil /admin/list
      try {
        const res = await fetch(WORKER_URL + '/admin/list', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-password': pw },
        });
        if (res.status === 401) {
          errBox.style.display = 'block';
          errBox.textContent = 'Password salah.';
          return;
        }
        sessionStorage.setItem('admin_pw', pw);
        document.getElementById('gate').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        const data = await res.json();
        renderCodes(data.items || []);
      } catch (e) {
        errBox.style.display = 'block';
        errBox.textContent = '⚠️ Gagal terhubung ke server: ' + e.message;
      }
    }

    async function loadCodes() {
      const table = document.getElementById('codesTable');
      table.innerHTML = '<p class="empty">Memuat...</p>';
      try {
        const res = await fetch(WORKER_URL + '/admin/list', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-password': getAdminPw() },
        });
        const data = await res.json();
        renderCodes(data.items || []);
      } catch (e) {
        table.innerHTML = '<p class="empty">⚠️ Gagal memuat data: ' + e.message + '</p>';
      }
    }

    function renderCodes(items) {
      const table = document.getElementById('codesTable');
      if (!items.length) {
        table.innerHTML = '<p class="empty">Belum ada kode akses yang dibuat.</p>';
        return;
      }
      let html = '<table><tr><th>Kode</th><th>Pelanggan</th><th>Kedaluwarsa</th><th>Status</th><th></th></tr>';
      const now = new Date();
      for (const item of items) {
        const exp = new Date(item.expiresAt);
        const isActive = exp > now;
        html += `<tr>
          <td><code>${item.code}</code></td>
          <td>${item.customerName || '—'}</td>
          <td>${exp.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })}</td>
          <td><span class="badge ${isActive ? 'active' : 'expired'}">${isActive ? 'Aktif' : 'Kedaluwarsa'}</span></td>
          <td><button class="revoke-btn" onclick="revokeCode('${item.code}')">Cabut</button></td>
        </tr>`;
      }
      html += '</table>';
      table.innerHTML = html;
    }

    async function generateCode() {
      const customerName = document.getElementById('customerName').value.trim();
      const days = parseInt(document.getElementById('customerDays').value, 10) || 30;
      const box = document.getElementById('resultBox');

      try {
        const res = await fetch(WORKER_URL + '/admin/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-password': getAdminPw() },
          body: JSON.stringify({ customerName, days }),
        });
        const data = await res.json();
        if (data.error) {
          box.style.cssText = 'display:block;background:#ffeef0;border-color:#ffc6cc;color:#cc0000';
          box.textContent = '❌ ' + data.error.message;
          return;
        }
        box.style.cssText = 'display:block;background:#e8f8ee;border-color:#a3d9b4;color:#1a7a3e';
        const exp = new Date(data.expiresAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        box.innerHTML = `✅ Kode berhasil dibuat untuk <strong>${data.customerName || 'pelanggan'}</strong>, berlaku hingga ${exp}:<br/>
          <code id="newCode">${data.code}</code>
          <button class="copy-btn" onclick="copyCode()">Salin</button>`;
        document.getElementById('customerName').value = '';
        loadCodes();
      } catch (e) {
        box.style.cssText = 'display:block;background:#ffeef0;border-color:#ffc6cc;color:#cc0000';
        box.textContent = '⚠️ Gagal terhubung ke server: ' + e.message;
      }
    }

    function copyCode() {
      const code = document.getElementById('newCode').textContent;
      navigator.clipboard.writeText(code);
    }

    async function revokeCode(code) {
      if (!confirm(`Cabut kode ${code}? Pengguna tidak akan bisa login lagi dengan kode ini.`)) return;
      try {
        await fetch(WORKER_URL + '/admin/revoke', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-password': getAdminPw() },
          body: JSON.stringify({ code }),
        });
        loadCodes();
      } catch (e) {
        alert('Gagal mencabut kode: ' + e.message);
      }
    }
  </script>
</body>
</html>
