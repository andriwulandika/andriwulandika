<!DOCTYPE html>
<html lang="id">
<head>
  <script src="assets/js/analytics.js" defer></script>
  <script src="/assets/js/ui-enhance.js" defer></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Halaman Tidak Ditemukan</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --bg2: #f5f5f7; --text: #1d1d1f; --text2: #6e6e73;
      --accent: #0071e3; --border: #d2d2d7;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 24px; text-align: center;
    }
    .code {
      font-size: clamp(5rem, 15vw, 9rem); font-weight: 700;
      letter-spacing: -0.06em; color: var(--bg2);
      line-height: 1; margin-bottom: 0.5rem;
    }
    h1 {
      font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 700;
      letter-spacing: -0.03em; color: var(--text);
      margin-bottom: 0.8rem;
    }
    p {
      font-size: 1rem; color: var(--text2);
      max-width: 380px; line-height: 1.6; margin-bottom: 2.4rem;
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .btn-dark {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--text); color: #fff;
      padding: 13px 24px; border-radius: 980px;
      font-size: 0.9rem; font-weight: 500;
      text-decoration: none; transition: background 0.2s;
    }
    .btn-dark:hover { background: #333; }
    .btn-light {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--bg2); color: var(--text);
      padding: 13px 24px; border-radius: 980px;
      font-size: 0.9rem; font-weight: 500;
      text-decoration: none; transition: background 0.2s;
    }
    .btn-light:hover { background: #e5e5ea; }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Halaman Tidak Ditemukan</h1>
  <p>Halaman yang Anda cari tidak ada atau sudah dipindahkan. Silakan kembali ke beranda.</p>
  <div class="actions">
    <a href="index.html" class="btn-dark">← Kembali ke Beranda</a>
    <a href="https://ai.andriwulandika.uk/sirenja.html" class="btn-light">Coba SiRENJA</a>
  </div>
</body>
</html>
